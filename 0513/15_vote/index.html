<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人気コンビニ総選挙</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <h1>🏪 人気コンビニ総選挙！</h1>

    <div id="voteList">

        <!-- ファミマ -->
        <div class="card famima" data-id="1">

            <div class="badge">ファミマ</div>

            <div class="candidate-image">
                <img src="./images/candidate1.png" alt="ファミリーマート">
            </div>

            <div class="candidate-name">
                ファミリーマート
            </div>

            <div class="votes">
                0票
            </div>

            <div class="progress-bar">
                <div class="bar"></div>
            </div>

            <button class="vote-btn">
                投票する
            </button>

        </div>

        <!-- セブン -->
        <div class="card seven" data-id="2">

            <div class="badge">セブン</div>

            <div class="candidate-image">
                <img src="./images/candidate2.png" alt="セブンイレブン">
            </div>

            <div class="candidate-name">
                セブンイレブン
            </div>

            <div class="votes">
                0票
            </div>

            <div class="progress-bar">
                <div class="bar"></div>
            </div>

            <button class="vote-btn">
                投票する
            </button>

        </div>

        <!-- ローソン -->
        <div class="card lawson" data-id="3">

            <div class="badge">ローソン</div>

            <div class="candidate-image">
                <img src="./images/candidate3.png" alt="ローソン">
            </div>

            <div class="candidate-name">
                ローソン
            </div>

            <div class="votes">
                0票
            </div>

            <div class="progress-bar">
                <div class="bar"></div>
            </div>

            <button class="vote-btn">
                投票する
            </button>

        </div>

    </div>

    <script type="module" src="./js/main.js"></script>

</body>

</html>
