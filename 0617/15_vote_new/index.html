<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人気コンビニ総選挙</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <button id="resetBtn">リセット</button>

  <h1>🏪 人気コンビニ総選挙！</h1>
  <section class="intro fade-section">

    <h2>あなたの推しコンビニは？</h2>

    <p>
      ファミリーマート、
      セブンイレブン、
      ローソン。

      日本を代表する3つのコンビニから
      お気に入りを選んで投票しよう！
    </p>

  </section>
  <div id="voteList">

    <!-- ファミマ -->
    <div class="card famima" data-id="1">

      <div class="badge">ファミマ</div>

      <div class="candidate-image">
        <img src="./images/candidate1.png" alt="ファミリーマート">
      </div>

      <div class="candidate-name">
        ファミリーマート
      </div>

      <div class="votes">
        0票
      </div>

      <div class="progress-bar">
        <div class="bar"></div>
      </div>

      <button class="vote-btn">
        投票する
      </button>

    </div>

    <!-- セブン -->
    <div class="card seven" data-id="2">

      <div class="badge">セブン</div>

      <div class="candidate-image">
        <img src="./images/candidate2.png" alt="セブンイレブン">
      </div>

      <div class="candidate-name">
        セブンイレブン
      </div>

      <div class="votes">
        0票
      </div>

      <div class="progress-bar">
        <div class="bar"></div>
      </div>

      <button class="vote-btn">
        投票する
      </button>

    </div>

    <!-- ローソン -->
    <div class="card lawson" data-id="3">

      <div class="badge">ローソン</div>

      <div class="candidate-image">
        <img src="./images/candidate3.png" alt="ローソン">
      </div>

      <div class="candidate-name">
        ローソン
      </div>

      <div class="votes">
        0票
      </div>

      <div class="progress-bar">
        <div class="bar"></div>
      </div>

      <button class="vote-btn">
        投票する
      </button>

    </div>

  </div>
  <section class="about fade-section">

    <h2>コンビニ総選挙について</h2>

    <p>
      このサイトはJavaScriptとMotionを使った
      投票システムです。

      ボタンを押すとリアルタイムで
      得票率が更新されます。
    </p>

  </section>

  <script type="module" src="./src/main.js"></script>

</body>

</html>
